<div class="app-layout">
  <header class="header">
    <div class="header-container">
      <div class="logo" routerLink="/content">
        <h1>RSS Reader</h1>
      </div>

      <nav>
        <ul class="nav-list">
          @if (isLoggedIn) {
            <li class="nav-item username">
              <span class="welcome-text">{{ getUsername() }}</span>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/content" routerLinkActive="active">
                Лента
              </a>
            </li>

            @if (!isAdmin) {
              <li class="nav-item">
                <a class="nav-link" routerLink="/archive" routerLinkActive="active">
                  Архив
                </a>
              </li>
            
              <li class="nav-item">
                <a class="nav-link" routerLink="/favorites" routerLinkActive="active">
                  Избранное
                </a>
              </li>
            }

            <li class="nav-item">
              <a class="nav-link" routerLink="/channels" routerLinkActive="active">
                Каналы
              </a>
            </li>

            @if (isAdmin) {
              <li class="nav-item">
                <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">
                  Пользователи
                </a>
              </li>
            }

            <li class="nav-item">
              <button class="nav-link logout-btn" (click)="logout()">
                Выйти
              </button>
            </li>
          } @else {
            <li class="nav-item">
              <a class="nav-link" routerLink="/login" routerLinkActive="active">
                Войти
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
