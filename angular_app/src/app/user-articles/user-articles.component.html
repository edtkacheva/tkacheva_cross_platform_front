<h2>Статьи из подписок</h2>

<div *ngIf="articles.length === 0">
  Нет статей
</div>

<div *ngFor="let article of articles" class="article-card">
  <h3>{{ article.title }}</h3>
  <p>{{ article.description }}</p>
  <small>
    Канал: {{ article.rssChannel.name }} |
    {{ article.publishedAt | date:'dd.MM.yyyy' }}
  </small>
  <br>
  <a [href]="article.url" target="_blank">Читать</a>
</div>
