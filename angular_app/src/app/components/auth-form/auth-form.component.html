<div class="auth-container">
  <div class="auth-card">
    <h2>{{ isRegisterMode ? 'Создать аккаунт' : 'Вход' }}</h2>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Логин</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="Введите имя пользователя"
          class="form-control">
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Введите пароль"
            class="form-control">
          </div>

          @if (isRegisterMode) {
            <div class="form-group">
              <label for="confirmPassword">Повторите пароль</label>
              <input
                type="password"
                id="confirmPassword"
                formControlName="confirmPassword"
                placeholder="Повторите пароль"
                class="form-control">
              </div>
            }

            @if (errorMessage) {
              <div class="alert alert-error">
                {{ errorMessage }}
              </div>
            }

            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="authForm.invalid || isLoading">
              {{ isLoading ? 'Загрузка...' : (isRegisterMode ? 'Зарегистрироваться' : 'Войти') }}
            </button>

            <div class="auth-footer">
              <span>{{ isRegisterMode ? 'Уже есть аккаунт?' : "Нет аккаунта?" }}</span>
              <button type="button" class="btn-link" (click)="switchMode()">
                {{ isRegisterMode ? 'Войти' : 'Регистрация' }}
              </button>
            </div>
          </form>
        </div>
      </div>
