<div class="auth-container">
  <div class="auth-card">
    <h2>{{ isRegisterMode ? 'Create Account' : 'Login' }}</h2>
    
    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username"
          placeholder="Enter your username"
          class="form-control">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          placeholder="Enter your password"
          class="form-control">
      </div>

      <div *ngIf="isRegisterMode" class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword"
          placeholder="Confirm your password"
          class="form-control">
      </div>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="authForm.invalid || isLoading">
        {{ isLoading ? 'Loading...' : (isRegisterMode ? 'Register' : 'Login') }}
      </button>

      <div class="auth-footer">
        <span>{{ isRegisterMode ? 'Already have an account?' : "Don't have an account?" }}</span>
        <button type="button" class="btn-link" (click)="switchMode()">
          {{ isRegisterMode ? 'Login' : 'Register' }}
        </button>
      </div>
    </form>
  </div>
</div>
